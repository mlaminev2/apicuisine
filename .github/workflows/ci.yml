name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check app tests

      - name: Tests (pytest)
        shell: bash
        run: pytest -q 2>&1 | tee pytest-output.txt

      - name: Annoter les échecs pytest
        if: failure()
        shell: bash
        run: |
          grep -E "FAILED|^ERROR|^E   " pytest-output.txt | head -10 | while IFS= read -r l; do
            echo "::error::$l"
          done
          tail -5 pytest-output.txt | while IFS= read -r l; do echo "::error::$l"; done

      - name: Syntaxe JavaScript
        run: |
          for f in $(find web/js -name '*.js'); do
            node --check "$f"
          done

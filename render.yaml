services:
  - type: web
    name: menus-famille
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python create_icons.py
    startCommand: python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:////data/menu.db
      - key: GOOGLE_CLIENT_ID
        value: ""
      - key: GOOGLE_CLIENT_SECRET
        value: ""
      - key: APPLE_CLIENT_ID
        value: ""
      - key: APPLE_TEAM_ID
        value: ""
      - key: APPLE_KEY_ID
        value: ""
      - key: APPLE_PRIVATE_KEY
        value: ""

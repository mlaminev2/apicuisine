services:
  - type: web
    name: menus-famille
    runtime: python
    plan: free
    pythonVersion: "3.11"
    buildCommand: pip install -r requirements.txt && python create_icons.py
    startCommand: python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:////data/menu.db
      # GOOGLE_CLIENT_ID et GOOGLE_CLIENT_SECRET : à renseigner dans le dashboard Render

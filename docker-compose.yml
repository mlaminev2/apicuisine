version: "3.9"

services:
  app:
    build: .
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - menu_data:/data
      - menu_uploads:/app/web/uploads
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:////data/menu.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  menu_data:
  menu_uploads:
